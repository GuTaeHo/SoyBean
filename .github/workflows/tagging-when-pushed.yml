# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 태그를 적용하려면 전체 히스토리가 필요함

      - name: Get latest tag from GitHub
        id: get_latest_tag
        run: |
          LATEST_TAG=$(curl -s "https://api.github.com/repos/${{ github.repository }}/tags" | jq -r '.[0].name')
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV


      - name: Increment tag version
        id: new_tag
        run: |
          TAG=${LATEST_TAG:-"0.0.0"}
          NEW_TAG=$(echo $TAG | awk -F. '{$NF++; print $0}' OFS=.)
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

      - name: Create and push tag
        run: |
          git config --global user.name "GuTaeHo"
          git config --global user.email "sbpdt1062@gmail.com"
          git tag $TAG_NAME
          git push origin $TAG_NAME
